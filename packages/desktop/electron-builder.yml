# A local, unsigned build: `pnpm package` makes "Anur Dev.app" from this.
# `pnpm release <version>` adds signing, notarising, the DMG and the update
# feed on top of it (scripts/release.mjs) and makes "Anur.app".
appId: ai.heyanur.anur-desktop
productName: Anur
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  darkModeSupport: true
  target: dir
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Anur can open .md files from Finder; it asks before becoming their default.
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Markdown document
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        # macOS draws Anur's own document icon; without one, Finder shows the
        # icon of whichever other app declared the type (Obsidian's).
        CFBundleTypeIconSystemGenerated: true
        LSItemContentTypes:
          - net.daringfireball.markdown
        CFBundleTypeExtensions:
          - md
          - markdown
      # A folder dropped on Anur's icon, or handed to it with `open -a`, opens as a folder.
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: None
        LSItemContentTypes:
          - public.folder
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: net.daringfireball.markdown
        UTTypeDescription: Markdown document
        UTTypeConformsTo:
          - public.plain-text
        UTTypeTagSpecification:
          public.filename-extension:
            - md
            - markdown
          public.mime-type:
            - text/markdown
publish:
  provider: generic
  url: https://spaces.hianur.com/
