# A local, unsigned build for trying Anur as a real app. Signing,
# notarising and automatic updates come with group 13.
appId: ai.heyanur.anur-desktop
productName: Anur
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  darkModeSupport: true
  target: dir
  identity: null
  # Anur can open .md files from Finder; it asks before becoming their default.
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Markdown document
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - net.daringfireball.markdown
        CFBundleTypeExtensions:
          - md
          - markdown
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: net.daringfireball.markdown
        UTTypeDescription: Markdown document
        UTTypeConformsTo:
          - public.plain-text
        UTTypeTagSpecification:
          public.filename-extension:
            - md
            - markdown
          public.mime-type:
            - text/markdown
