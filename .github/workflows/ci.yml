name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Tests never launch Electron, so CI skips downloading it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The PR's description fills the template: its sections and a release note.
      - if: github.event_name == 'pull_request'
        run: node packages/desktop/scripts/pr-description.mjs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @anur/desktop build
