name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Reading the code, and the PR's description for its check.
    permissions:
      contents: read
      pull-requests: read
    env:
      # Tests never launch Electron, so CI skips downloading it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The PR's description fills the template: its sections and a release note.
      # Read live, not from the event: a re-run after editing the description
      # would otherwise check the text the run started with.
      - if: github.event_name == 'pull_request'
        run: |
          body="$(gh pr view "$PR" --repo "$REPO" --json body --jq .body)"
          PR_BODY="$body" node packages/desktop/scripts/pr-description.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @anur/desktop build
